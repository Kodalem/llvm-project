name: LLVM Patmos CI - Optimized

on:
  push:
    branches:
      - main
      - patmos-llvm-22x-rusty*
  pull_request:
    branches:
      - main
      - patmos-llvm-22x-rusty*
      
env:
  NIX_BUILD_CORES: 8
  CI_MAX_PARALLEL: 5
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 20G

jobs:
  setup-pasim:
    name: Setup Patmos Simulator
    runs-on: namespace-profile-beta-cicd
    timeout-minutes: 30
    outputs:
      pasim_path: ${{ steps.set_pasim_path.outputs.path }}  # <-- Add output
      pasim_dir: ${{ steps.set_pasim_path.outputs.dir }}    # <-- Add output

    steps:
      - name: Ensure tools for downloading simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y wget tar

      - name: Download and validate pasim
        id: set_pasim_path  # <-- Add ID for outputs
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/patmos-tools"
          cd "$GITHUB_WORKSPACE/patmos-tools"
          wget -O patmos-simulator.tar.gz https://github.com/t-crest/patmos-simulator/releases/latest/download/patmos-simulator-x86_64-linux-gnu.tar.gz
          tar -xvf patmos-simulator.tar.gz
  
          PASIM_PATH="$GITHUB_WORKSPACE/patmos-tools/bin/pasim"
          if [ ! -f "$PASIM_PATH" ]; then
            echo "::error::pasim not found at $PASIM_PATH"
            ls -laR "$GITHUB_WORKSPACE/patmos-tools" || true
            exit 1
          fi
  
          chmod +x "$PASIM_PATH"
          PASIM_HELP="$("$PASIM_PATH" --help 2>&1 || true)"
          case "$PASIM_HELP" in
            *"Generic options:"*) ;;
            *) echo "::error::pasim smoke check failed"; exit 1 ;;
          esac
  
          # Output the paths for downstream jobs
          echo "path=$PASIM_PATH" >> $GITHUB_OUTPUT
          echo "dir=$(dirname $PASIM_PATH)" >> $GITHUB_OUTPUT

      - name: Debug artifact before upload
        run: |
          ls -laR "$GITHUB_WORKSPACE/patmos-tools"

      - name: Upload patmos simulator tools
        uses: actions/upload-artifact@v4
        with:
          name: patmos-simulator-tools
          path: ${{ github.workspace }}/patmos-tools
          retention-days: 1

  build-llvm:
    name: Build LLVM
    runs-on: namespace-profile-beta-cicd
    timeout-minutes: 240

    steps:
      - name: Checkout LLVM monorepo
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          path: llvm-project
          fetch-depth: 10

      - name: Prepare cache directories
        run: |
          mkdir -p "$CCACHE_DIR"
          mkdir -p llvm-project/build

      - name: Ensure build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache wget


      - name: Configure Namespace cache volume
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            llvm-project/build/
            llvm-project/build-compiler-rt/
            llvm-project/build-newlib/
            llvm-project/build-bench/

      - name: Show ccache config (pre-build)
        run: |
          ccache --show-config || true
          ccache -s || true

      - name: Configure LLVM
        working-directory: llvm-project
        run: |
          cmake -S llvm -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_TARGETS_TO_BUILD=Patmos \
            -DLLVM_DEFAULT_TARGET_TRIPLE=patmos-unknown-unknown-elf \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DCLANG_ENABLE_OBJC_REWRITER=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_BUILD_EXAMPLES=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_INSTALL_BINUTILS_SYMLINKS=OFF \
            -DLLVM_INSTALL_CCTOOLS_SYMLINKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_APPEND_VC_REV=OFF \
            -DLLVM_ENABLE_WARNINGS=OFF \
            -DLLVM_ENABLE_PEDANTIC=OFF \
            -DLLVM_ENABLE_LIBPFM=OFF \
            -DLLVM_BUILD_INSTRUMENTED_COVERAGE=OFF \
            -DLLVM_INSTALL_UTILS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build LLVM
        working-directory: llvm-project
        run: cmake --build build -- -j"$CI_MAX_PARALLEL"

      - name: Package toolchain payload (small artifact for downstream jobs)
        working-directory: llvm-project
        run: |
          mkdir -p toolchain-payload
          cp -v -a build/bin toolchain-payload/
          cp -v -a build/lib toolchain-payload/ || true
          cp -v -a build/libexec toolchain-payload/ || true
          tar -czf llvm-toolchain-payload.tar.gz -C toolchain-payload .

      - name: Upload toolchain payload
        uses: actions/upload-artifact@v4
        with:
          name: llvm-toolchain-payload
          path: llvm-project/llvm-toolchain-payload.tar.gz
          retention-days: 1

      - name: Upload CMake/Ninja logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-build-logs
          path: |
            llvm-project/build/CMakeCache.txt
            llvm-project/build/CMakeFiles/CMakeOutput.log
            llvm-project/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Show ccache stats (post-build)
        if: always()
        run: ccache -s || true

  test-llvm:
    name: Test LLVM
    needs: [build-llvm]
    runs-on: namespace-profile-beta-cicd
    timeout-minutes: 120

    steps:
      - name: Checkout LLVM monorepo
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          path: llvm-project

      - name: Ensure build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache wget

      - name: Download LLVM toolchain payload
        uses: actions/download-artifact@v4
        with:
          name: llvm-toolchain-payload
          path: llvm-project

      - name: Unpack LLVM toolchain payload
        working-directory: llvm-project
        run: |
          mkdir -p build
          tar -xzf llvm-toolchain-payload.tar.gz -C build

      - name: Download and validate pasim
        working-directory: llvm-project
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget tar

          mkdir -p "$GITHUB_WORKSPACE/llvm-project/patmos-tools"
          cd "$GITHUB_WORKSPACE/llvm-project/patmos-tools"
          wget -O patmos-simulator.tar.gz https://github.com/t-crest/patmos-simulator/releases/latest/download/patmos-simulator-x86_64-linux-gnu.tar.gz
          tar -xvf patmos-simulator.tar.gz

          PASIM_PATH="$GITHUB_WORKSPACE/llvm-project/patmos-tools/bin/pasim"
          PASIM_BIN_DIR="$(dirname "$PASIM_PATH")"

          if [ ! -f "$PASIM_PATH" ]; then
            echo "::error::pasim not found at $PASIM_PATH"
            ls -laR "$GITHUB_WORKSPACE/llvm-project/patmos-tools" || true
            exit 1
          fi
          chmod +x "$PASIM_PATH"

          if [ ! -x "$PASIM_PATH" ]; then
            echo "::error::pasim not found or not executable at $PASIM_PATH"
            ls -laR "$GITHUB_WORKSPACE/llvm-project/patmos-tools" || true
            exit 1
          fi

          PASIM_HELP="$("$PASIM_PATH" --help 2>&1 || true)"
          case "$PASIM_HELP" in
            *"Generic options:"*) ;;
            *)
              echo "::error::pasim smoke check failed"
              ls -laR "$GITHUB_WORKSPACE/llvm-project/patmos-tools" || true
              exit 1
              ;;
          esac

          echo "$PASIM_BIN_DIR" >> "$GITHUB_PATH"
          echo "PATMOS_PASIM=$PASIM_PATH" >> "$GITHUB_ENV"
          echo "PASIM=$PASIM_PATH" >> "$GITHUB_ENV"
          PATH="$PASIM_BIN_DIR:$PATH" command -v "$(basename "$PASIM_PATH")"

      - name: Verify workspace structure
        working-directory: llvm-project
        run: |
          echo "=== Current directory: $(pwd) ==="
          echo "=== Directory listing ==="
          ls -la
          echo ""
          echo "=== Checking required directories ==="
          test -d "$(pwd)/build" || { echo "::error::build/ directory missing"; exit 1; }
          test -d "$(pwd)/llvm" || { echo "::error::llvm/ directory missing"; exit 1; }
          echo "build/ and llvm/ directories found"

      - name: Test LLVM (Patmos-filtered)
        working-directory: llvm-project
        env:
          PATMOS_PASIM: ${{ env.PATMOS_PASIM }}
          PASIM: ${{ env.PASIM }}
        run: |
          set -euo pipefail
          PASIM_PATH="${PATMOS_PASIM}" 
          if [ ! -x "$PASIM_PATH" ]; then
            echo "::error::pasim not found or not executable at $PASIM_PATH"
            exit 1
          fi
          export PASIM="$PASIM_PATH"
          
          LIT_BIN="$(pwd)/build/bin/llvm-lit"
          TEST_DIR="$(pwd)/llvm/test"
          SITE_CFG="$(pwd)/build/test/lit.site.cfg.py"
          
          test -x "$LIT_BIN" || { echo "::error::Missing llvm-lit at $LIT_BIN"; exit 1; }
          test -f "$SITE_CFG" || {
            echo "::error::Missing lit.site.cfg.py at $SITE_CFG"
            ls -la "$(pwd)/build/test/" || true
            find "$(pwd)/build" -maxdepth 4 -name "lit.site.cfg.py" || true
            exit 1
          }
          
          "$LIT_BIN" "$TEST_DIR" -v --filter=Patmos

  build-newlib:
    name: Build Newlib
    needs: build-llvm
    runs-on: namespace-profile-beta-cicd
    timeout-minutes: 180

    steps:
      - name: Checkout LLVM monorepo (for consistent workspace layout)
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          path: llvm-project

      - name: Download LLVM toolchain payload
        uses: actions/download-artifact@v4
        with:
          name: llvm-toolchain-payload
          path: llvm-project

      - name: Unpack LLVM toolchain payload
        working-directory: llvm-project
        run: |
          mkdir -p build
          tar -xzf llvm-toolchain-payload.tar.gz -C build

      - name: Clone Patmos-Newlib
        working-directory: llvm-project
        run: git clone https://github.com/t-crest/patmos-newlib

      - name: Cache Newlib build directory
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            llvm-project/build-newlib/

      - name: Configure and Build Newlib
        working-directory: llvm-project
        run: |
          mkdir -p build-newlib
          cd build-newlib
          ../patmos-newlib/configure \
            --target=patmos-unknown-unknown-elf \
            --prefix=/usr \
            AR_FOR_TARGET="$(pwd)/../build/bin/llvm-ar" \
            CC_FOR_TARGET="$(pwd)/../build/bin/clang" \
            CFLAGS_FOR_TARGET="-target patmos-unknown-unknown-elf -O2 -emit-llvm -Wno-error -Wno-error=deprecated-non-prototype -Wno-error=invalid-noreturn -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types" \
            RANLIB_FOR_TARGET="$(pwd)/../build/bin/llvm-ranlib" \
            LD_FOR_TARGET="$(pwd)/../build/bin/clang"
          make -j"$CI_MAX_PARALLEL"

      - name: Install Newlib sysroot
        working-directory: llvm-project
        run: |
          mkdir -p out/newlib-sysroot
          cd build-newlib
          make install DESTDIR="$(pwd)/../out/newlib-sysroot"

      - name: Upload Newlib sysroot artifact
        uses: actions/upload-artifact@v4
        with:
          name: newlib-sysroot
          path: llvm-project/out/newlib-sysroot
          retention-days: 1

  test-clang:
    name: Test Clang
    needs: [build-llvm, build-newlib]
    runs-on: namespace-profile-beta-cicd
    timeout-minutes: 120

    steps:
      - name: Checkout LLVM monorepo
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          path: llvm-project

      - name: Download LLVM toolchain payload
        uses: actions/download-artifact@v4
        with:
          name: llvm-toolchain-payload
          path: llvm-project

      - name: Unpack LLVM toolchain payload
        working-directory: llvm-project
        run: |
          mkdir -p build
          tar -xzf llvm-toolchain-payload.tar.gz -C build

      - name: Download Newlib sysroot
        uses: actions/download-artifact@v4
        with:
          name: newlib-sysroot
          path: llvm-project/out/newlib-sysroot

      - name: Download and validate pasim
        working-directory: llvm-project
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget tar

          mkdir -p "$GITHUB_WORKSPACE/llvm-project/patmos-tools"
          cd "$GITHUB_WORKSPACE/llvm-project/patmos-tools"
          wget -O patmos-simulator.tar.gz https://github.com/t-crest/patmos-simulator/releases/latest/download/patmos-simulator-x86_64-linux-gnu.tar.gz
          tar -xvf patmos-simulator.tar.gz

          PASIM_PATH="$GITHUB_WORKSPACE/llvm-project/patmos-tools/bin/pasim"
          PASIM_BIN_DIR="$(dirname "$PASIM_PATH")"

          if [ ! -f "$PASIM_PATH" ]; then
            echo "::error::pasim not found at $PASIM_PATH"
            ls -laR "$GITHUB_WORKSPACE/llvm-project/patmos-tools" || true
            exit 1
          fi
          chmod +x "$PASIM_PATH"

          if [ ! -x "$PASIM_PATH" ]; then
            echo "::error::pasim not found or not executable at $PASIM_PATH"
            ls -laR "$GITHUB_WORKSPACE/llvm-project/patmos-tools" || true
            exit 1
          fi

          PASIM_HELP="$("$PASIM_PATH" --help 2>&1 || true)"
          case "$PASIM_HELP" in
            *"Generic options:"*) ;;
            *)
              echo "::error::pasim smoke check failed"
              ls -laR "$GITHUB_WORKSPACE/llvm-project/patmos-tools" || true
              exit 1
              ;;
          esac

          echo "$PASIM_BIN_DIR" >> "$GITHUB_PATH"
          echo "PATMOS_PASIM=$PASIM_PATH" >> "$GITHUB_ENV"
          echo "PASIM=$PASIM_PATH" >> "$GITHUB_ENV"
          PATH="$PASIM_BIN_DIR:$PATH" command -v "$(basename "$PASIM_PATH")"

      - name: Export toolchain and sysroot paths
        working-directory: llvm-project
        run: |
          echo "${GITHUB_WORKSPACE}/llvm-project/build/bin" >> "$GITHUB_PATH"
          echo "PATMOS_NEWLIB_SYSROOT=${GITHUB_WORKSPACE}/llvm-project/out/newlib-sysroot" >> "$GITHUB_ENV"
          echo "PATMOS_NEWLIB_LIB=${GITHUB_WORKSPACE}/llvm-project/out/newlib-sysroot/usr/lib" >> "$GITHUB_ENV"
          echo "PATMOS_NEWLIB_INCLUDE=${GITHUB_WORKSPACE}/llvm-project/out/newlib-sysroot/usr/include" >> "$GITHUB_ENV"

      - name: Build ClangPatmosTestDeps
        working-directory: llvm-project
        run: cmake --build build --target ClangPatmosTestDeps -- -j"$CI_MAX_PARALLEL"

      - name: Verify workspace structure
        working-directory: llvm-project
        run: |
          set -euo pipefail
          echo "=== Current directory: $(pwd) ==="
          echo "=== Directory listing ==="
          ls -la
          echo ""
          echo "=== Checking required directories ==="
          test -d "$(pwd)/build" || { echo "::error::build/ directory missing"; exit 1; }
          if [ -d "$(pwd)/llvm/clang" ]; then
            echo "Using llvm/clang layout"
          elif [ -d "$(pwd)/clang" ]; then
            echo "Using top-level clang layout"
          else
            echo "::error::Missing clang sources (expected llvm/clang or clang)"
            exit 1
          fi

      - name: Test Clang (Patmos-filtered, with Newlib sysroot)
        working-directory: llvm-project
        env:
          PATMOS_NEWLIB_SYSROOT: ${{ env.PATMOS_NEWLIB_SYSROOT }}
          PATMOS_NEWLIB_LIB: ${{ env.PATMOS_NEWLIB_LIB }}
          PATMOS_NEWLIB_INCLUDE: ${{ env.PATMOS_NEWLIB_INCLUDE }}
          PATMOS_PASIM: ${{ env.PATMOS_PASIM }}
          PASIM: ${{ env.PASIM }}
        run: |
          set -euo pipefail
          PASIM_PATH="${PATMOS_PASIM}"  # Directly use the env var
          if [ ! -x "$PASIM_PATH" ]; then
          echo "::error::pasim not found or not executable at $PASIM_PATH"
          exit 1
          fi
          export PASIM="$PASIM_PATH"

          LIT_BIN="$(pwd)/build/bin/llvm-lit"
          if [ -d "$(pwd)/llvm/clang/test" ]; then
            TEST_DIR="$(pwd)/llvm/clang/test"
          else
            TEST_DIR="$(pwd)/clang/test"
          fi
          SITE_CFG="$(pwd)/build/test/lit.site.cfg.py"

          test -x "$LIT_BIN" || { echo "::error::Missing llvm-lit at $LIT_BIN"; exit 1; }
          test -f "$SITE_CFG" || {
            echo "::error::Missing lit.site.cfg.py at $SITE_CFG"
            ls -la "$(pwd)/build/test/" || true
            find "$(pwd)/build" -maxdepth 4 -name "lit.site.cfg.py" || true
            exit 1
          }

          "$LIT_BIN" "$TEST_DIR" -v --filter=Patmos

