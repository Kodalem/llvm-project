          echo "PASIM=$PASIM_PATH" >> "$GITHUB_ENV"
          PATH="$PASIM_BIN_DIR:$PATH" command -v "$(basename "$PASIM_PATH")"

      - name: Cache Compiler-RT build directory
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            llvm-project/build-compiler-rt/

      - name: Configure Compiler-RT
        working-directory: llvm-project
        run: |
          mkdir -p build-compiler-rt
          cd build-compiler-rt
          cmake ../compiler-rt \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=../compiler-rt/cmake/patmos-clang-toolchain.cmake \
            -DCMAKE_C_COMPILER="$(pwd)/../build/bin/clang" \
            -DCMAKE_CXX_COMPILER="$(pwd)/../build/bin/clang++" \
            -DCOMPILER_RT_TEST_COMPILER="$(pwd)/../build/bin/clang" \
            -DLLVM_TOOLS_BINARY_DIR="$(pwd)/../build/bin" \
            -DLLVM_CONFIG_PATH="$(pwd)/../build/bin/llvm-config" \
            -DCOMPILER_RT_INCLUDE_TESTS=ON \
            -DCOMPILER_RT_TEST_STANDALONE_BUILD_LIBS=OFF

      - name: Build Compiler-RT
        working-directory: llvm-project
        run: |
          cd build-compiler-rt
          ninja -j"$CI_MAX_PARALLEL"

      - name: Verify workspace structure
        working-directory: llvm-project
        run: |
          set -euo pipefail
          echo "=== Current directory: $(pwd) ==="
          echo "=== Directory listing ==="
          ls -la
          echo ""
          echo "=== Checking required directories ==="
          test -d "$(pwd)/build" || { echo "::error::build/ directory missing"; exit 1; }
          test -d "$(pwd)/compiler-rt" || { echo "::error::compiler-rt/ directory missing"; exit 1; }
          test -d "$(pwd)/build-compiler-rt" || { echo "::error::build-compiler-rt/ directory missing"; exit 1; }

      - name: Test Compiler-RT
        working-directory: llvm-project
        env:
          PATMOS_PASIM: ${{ env.PATMOS_PASIM }}
          PASIM: ${{ env.PASIM }}
        run: |
          set -euo pipefail
          PASIM_PATH="${PATMOS_PASIM:-${PASIM:-}}"
          if [ -z "${PASIM_PATH:-}" ] || [ ! -f "$PASIM_PATH" ]; then
            PASIM_PATH="$(find "$GITHUB_WORKSPACE" -maxdepth 12 -type f -name pasim 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "${PASIM_PATH:-}" ]; then
            echo "::error::Could not find pasim under $GITHUB_WORKSPACE"
            echo "PATMOS_PASIM from env: ${PATMOS_PASIM:-<unset>}"
            find "$GITHUB_WORKSPACE" -maxdepth 10 -type f | sort | sed -n '1,300p'
            exit 1
          fi
          chmod +x "$PASIM_PATH"
          export PATMOS_PASIM="$PASIM_PATH"
          export PASIM="$PASIM_PATH"
          
          # Use absolute paths for llvm-lit
          LIT_BIN="$(pwd)/build/bin/llvm-lit"
          TEST_DIR="$(pwd)/compiler-rt/test"  # Compiler-RT test suite
          SITE_CFG="$(pwd)/build/test/lit.site.cfg.py"  # <-- Fixed: LLVM's lit.site.cfg.py
          
          test -x "$LIT_BIN" || { echo "::error::Missing llvm-lit at $LIT_BIN"; exit 1; }
          test -f "$SITE_CFG" || {
            echo "::error::Missing lit.site.cfg.py at $SITE_CFG"
            ls -la "$(pwd)/build/test/" || true
            find "$(pwd)/build" -maxdepth 4 -name "lit.site.cfg.py" || true
            exit 1
          }
          
          "$LIT_BIN" -v "$TEST_DIR"

      - name: Upload Compiler-RT build artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiler-rt-build
          path: llvm-project/build-compiler-rt
          retention-days: 1

  test-benchmarks:
    name: Test Benchmarks
    needs: [test-llvm, test-clang, test-lld, build-compiler-rt]
    runs-on: namespace-profile-beta-cicd
    timeout-minutes: 120

    steps:
      - name: Checkout LLVM monorepo
        uses: namespacelabs/nscloud-checkout-action@v8
        with:
          path: llvm-project

      - name: Cache benchmark/build state (Namespace cache volume)
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: |
            llvm-project/build/
            llvm-project/build-bench/
            ~/.ccache/

      - name: Download LLVM toolchain payload
        uses: actions/download-artifact@v4
        with:
          name: llvm-toolchain-payload
          path: llvm-project

      - name: Unpack LLVM toolchain payload
        working-directory: llvm-project
        run: |
          mkdir -p build
          tar -xzf llvm-toolchain-payload.tar.gz -C build

      - name: Download Newlib sysroot
        uses: actions/download-artifact@v4
        with:
          name: newlib-sysroot
          path: llvm-project/out/newlib-sysroot

      - name: Download Compiler-RT build
        uses: actions/download-artifact@v4
        with:
          name: compiler-rt-build
          path: llvm-project/build-compiler-rt

      - name: Clone benchmark suite
        working-directory: llvm-project
        env:
          BENCH_COMMIT: 4d5a76ab65df952ac41dd2da85fe067a3bb2d96a
        run: |
          git clone https://github.com/t-crest/patmos-benchmarks
          cd patmos-benchmarks
          git checkout "$BENCH_COMMIT"

      - name: Download and validate pasim
        working-directory: llvm-project
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget tar

          mkdir -p "$GITHUB_WORKSPACE/llvm-project/patmos-tools"
          cd "$GITHUB_WORKSPACE/llvm-project/patmos-tools"
          wget -O patmos-simulator.tar.gz https://github.com/t-crest/patmos-simulator/releases/latest/download/patmos-simulator-x86_64-linux-gnu.tar.gz
          tar -xvf patmos-simulator.tar.gz

          PASIM_PATH="$GITHUB_WORKSPACE/llvm-project/patmos-tools/bin/pasim"
          PASIM_BIN_DIR="$(dirname "$PASIM_PATH")"

          if [ ! -f "$PASIM_PATH" ]; then
            echo "::error::pasim not found at $PASIM_PATH"
            ls -laR "$GITHUB_WORKSPACE/llvm-project/patmos-tools" || true
            exit 1
          fi
          chmod +x "$PASIM_PATH"

          if [ ! -x "$PASIM_PATH" ]; then
            echo "::error::pasim not found or not executable at $PASIM_PATH"
            ls -laR "$GITHUB_WORKSPACE/llvm-project/patmos-tools" || true
            exit 1
          fi

          PASIM_HELP="$("$PASIM_PATH" --help 2>&1 || true)"
          case "$PASIM_HELP" in
            *"Generic options:"*) ;;
            *)
              echo "::error::pasim smoke check failed"
              ls -laR "$GITHUB_WORKSPACE/llvm-project/patmos-tools" || true
              exit 1
              ;;
          esac

          echo "$PASIM_BIN_DIR" >> "$GITHUB_PATH"
          echo "PATMOS_PASIM=$PASIM_PATH" >> "$GITHUB_ENV"
          echo "PASIM=$PASIM_PATH" >> "$GITHUB_ENV"
          PATH="$PASIM_BIN_DIR:$PATH" command -v "$(basename "$PASIM_PATH")"

      - name: Configure and build benchmarks
        working-directory: llvm-project
        run: |
          mkdir -p build-bench
          cmake -S patmos-benchmarks -B build-bench \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/llvm-project/patmos-benchmarks/cmake/patmos-clang-toolchain.cmake \
            -DENABLE_TESTING=true
          cmake --build build-bench -- -j"$CI_MAX_PARALLEL"

      - name: Run benchmark tests
        working-directory: llvm-project/build-bench
        run: ctest --output-on-failure -j"$CI_MAX_PARALLEL"

  package:
    name: Package
    needs: [test-llvm, test-clang, test-lld, build-compiler-rt]
    runs-on: namespace-profile-beta-cicd
    timeout-minutes: 60

    steps:
      - name: Download LLVM toolchain payload
        uses: actions/download-artifact@v4
        with:
          name: llvm-toolchain-payload
          path: artifacts

      - name: Download Compiler-RT build
        uses: actions/download-artifact@v4
        with:
          name: compiler-rt-build
          path: artifacts/compiler-rt-build

      - name: Download Newlib sysroot
        uses: actions/download-artifact@v4
        with:
          name: newlib-sysroot
          path: artifacts/newlib-sysroot

      - name: Package
        run: |
          mkdir -p out/toolchain
          tar -xzf artifacts/llvm-toolchain-payload.tar.gz -C out/toolchain
          cp -a artifacts/newlib-sysroot out/toolchain/newlib-sysroot
          cp -a artifacts/compiler-rt-build out/toolchain/compiler-rt-build
          tar -czf llvm-patmos-toolchain.tar.gz -C out toolchain

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: llvm-patmos-toolchain
          path: llvm-patmos-toolchain.tar.gz
          retention-days: 7
